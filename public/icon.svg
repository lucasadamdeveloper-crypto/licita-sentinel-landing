<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1E3D" />
      <stop offset="100%" stop-color="#050A14" />
    </radialGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Ícone (cantos arredondados padrão App Store / Play Store) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="6" stroke-opacity="0.3" />

  <!-- Círculos Concêntricos do Radar -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.5" />

  <!-- Linhas de Coordenadas em Cruz -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <line x1="256" y1="60" x2="256" y2="452" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Feixe de Varredura do Radar -->
  <path d="M 256 256 L 436 256 A 180 180 0 0 0 256 76 Z" fill="url(#radarSweep)" />

  <!-- Pulso / Ponto Central Brilhante -->
  <circle cx="256" cy="256" r="14" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" />

  <!-- Alvos Detectados (Blips de Editais PNCP) -->
  <circle cx="340" cy="180" r="10" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="340" cy="180" r="5" fill="#FFFBEB" />
  <circle cx="180" cy="320" r="8" fill="#10B981" filter="url(#glow)" />
  <circle cx="180" cy="320" r="4" fill="#ECFDF5" />

  <!-- Letra S / Escudo Sentinel Estilizado -->
  <path d="M 256 410 L 220 370 L 292 370 Z" fill="#00E5FF" opacity="0.6" />
</svg>
